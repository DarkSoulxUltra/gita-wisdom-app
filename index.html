<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gita Mood-Based Wisdom</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Martel:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            
            /* Mood Colors */
            --mood-happy: #22c55e;
            --mood-anger: #ef4444;
            --mood-sad: #06b6d4;
            --mood-peace: #d946ef;
            --mood-lazy: #eab308;
            --mood-lonely: #a855f7;
            --mood-protection: #f97316;
            --mood-anxiety: #ffbba6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Martel', serif;
            font-weight: 600;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Mood Selection */
        .mood-container {
            width: 100%;
            margin-bottom: 2rem;
        }
        
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .mood-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-transform: capitalize;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
        }

        .mood-btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.08);
        }

        .mood-btn.active {
            border-color: currentColor;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px -5px currentColor;
        }

        .mood-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--btn-color);
            box-shadow: 0 0 10px var(--btn-color);
        }

        /* Pull Strip Action */
        .action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .pull-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            color: #1a1a1a;
            padding: 1rem 3rem;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(253, 160, 133, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
            margin-bottom: 2rem;
        }

        .pull-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px -5px rgba(253, 160, 133, 0.6);
        }

        .pull-btn:active {
            transform: translateY(1px);
        }

        /* Paper Strip */
        .strip-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            overflow: hidden;
            display: none;
            margin-top: 2rem;
            border-radius: 12px;
        }

        .paper-strip {
            background-color: #fffaf0;
            color: #1e293b;
            padding: 3rem 2rem 2rem;
            position: relative;
            transform: translateY(100%);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            /* Jagged top edge */
            clip-path: polygon(0% 20px, 5% 0px, 10% 20px, 15% 0px, 20% 20px, 25% 0px, 30% 20px, 35% 0px, 40% 20px, 45% 0px, 50% 20px, 55% 0px, 60% 20px, 65% 0px, 70% 20px, 75% 0px, 80% 20px, 85% 0px, 90% 20px, 95% 0px, 100% 20px, 100% 100%, 0% 100%);
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            border-bottom: 8px solid var(--strip-color, #fffaf0);
        }

        .paper-strip.show {
            transform: translateY(0);
        }

        .verse-number {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--strip-color);
        }

        .verse-content {
            font-family: 'Martel', serif;
            font-size: 1.5rem;
            line-height: 1.6;
            text-align: center;
            margin: 2rem 0;
            color: #0f172a;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verse-example {
            background: rgba(0,0,0,0.03);
            padding: 1.5rem;
            border-left: 4px solid var(--strip-color);
            font-style: italic;
            font-size: 1.1rem;
            color: #334155;
            margin-bottom: 2rem;
            border-radius: 0 8px 8px 0;
        }

        .strip-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px dashed #cbd5e1;
            padding-top: 1.5rem;
        }

        .lang-toggles, .control-btns {
            display: flex;
            gap: 0.5rem;
        }

        .strip-btn {
            background: transparent;
            border: 1px solid #94a3b8;
            color: #475569;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .strip-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .strip-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #1e293b;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Revisit & Analytics Section */
        .bottom-section {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .bottom-section {
                grid-template-columns: 2fr 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .panel h3 {
            margin-bottom: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .revisit-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .revisit-list::-webkit-scrollbar {
            width: 6px;
        }
        .revisit-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .revisit-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .revisit-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .revisit-item .verse-ref {
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }

        .analytics-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 0.8rem 1rem;
            border-radius: 8px;
        }

        .stat-mood {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: capitalize;
        }

        .stat-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .stat-count {
            font-weight: bold;
            background: var(--card-bg);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
        }
        
        .empty-state {
            color: #64748b;
            font-style: italic;
            text-align: center;
            padding: 2rem 0;
        }

    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <header>
        <h1>Divine Wisdom</h1>
        <p>Seek guidance from the Shrimad Bhagavad Gita based on your current emotional state.</p>
    </header>

    <main>
        <section class="mood-container">
            <div class="mood-grid" id="mood-grid">
                <!-- Mood buttons injected here -->
            </div>
        </section>

        <section class="action-container">
            <button class="pull-btn" id="pull-btn">Pull Strip</button>

            <div class="strip-container" id="strip-container">
                <div class="paper-strip" id="paper-strip">
                    <div class="verse-number" id="verse-number">1.1</div>
                    <div class="verse-content" id="verse-content">
                        <!-- Verse text goes here -->
                    </div>
                    <div class="verse-example" id="verse-example">
                        <!-- Example goes here -->
                    </div>
                    <div class="strip-actions">
                        <div class="lang-toggles">
                            <button class="strip-btn" data-lang="sanskrit">Sanskrit</button>
                            <button class="strip-btn" data-lang="hindi">Hindi</button>
                            <button class="strip-btn active" data-lang="english">English</button>
                        </div>
                        <div class="control-btns">
                            <button class="strip-btn btn-icon" id="speak-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak
                            </button>
                            <button class="strip-btn btn-icon" id="mark-read-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Mark Read
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bottom-section">
            <div class="panel">
                <h3>Revisit Quotes <span id="revisit-count" style="font-size: 0.9rem; color: #64748b;">(0)</span></h3>
                <ul class="revisit-list" id="revisit-list">
                    <div class="empty-state">No quotes saved yet.</div>
                </ul>
            </div>
            <div class="panel">
                <h3>Mood Analytics</h3>
                <ul class="analytics-list" id="analytics-list">
                    <!-- Stats injected here -->
                </ul>
            </div>
        </section>
    </main>

    <script>
        const MOODS = {
            happy: { color: '#22c55e' },
            anger: { color: '#ef4444' },
            sad: { color: '#06b6d4' },
            peace: { color: '#d946ef' },
            lazy: { color: '#eab308' },
            lonely: { color: '#a855f7' },
            protection: { color: '#f97316' },
            anxiety: { color: '#ffbba6' }
        };

        // App State
        let allVerses = [];
        let unreadVerses = [];
        let readVerses = JSON.parse(localStorage.getItem('gita_read_verses')) || [];
        let moodAnalytics = JSON.parse(localStorage.getItem('gita_mood_analytics')) || {};
        let selectedMood = null;
        let currentQuote = null;
        let currentLang = 'english';
        let isSpeaking = false;

        // Initialize Moods in Analytics
        Object.keys(MOODS).forEach(m => {
            if (moodAnalytics[m] === undefined) moodAnalytics[m] = 0;
        });

        // DOM Elements
        const loader = document.getElementById('loader');
        const moodGrid = document.getElementById('mood-grid');
        const pullBtn = document.getElementById('pull-btn');
        const stripContainer = document.getElementById('strip-container');
        const paperStrip = document.getElementById('paper-strip');
        const verseNumberEl = document.getElementById('verse-number');
        const verseContentEl = document.getElementById('verse-content');
        const verseExampleEl = document.getElementById('verse-example');
        const langBtns = document.querySelectorAll('.lang-toggles .strip-btn');
        const speakBtn = document.getElementById('speak-btn');
        const markReadBtn = document.getElementById('mark-read-btn');
        const revisitList = document.getElementById('revisit-list');
        const analyticsList = document.getElementById('analytics-list');
        const revisitCount = document.getElementById('revisit-count');

        // Init App
        async function init() {
            renderMoodButtons();
            renderAnalytics();
            renderRevisitList();
            await fetchAllVerses();
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        async function fetchAllVerses() {
            try {
                const promises = [];
                for (let i = 1; i <= 7; i++) {
                    // Try fetching from local directory, fallback might be needed but assuming server serves them
                    promises.push(fetch(`gita_part${i}.json`).then(r => r.json()).catch(e => {
                        console.error(`Failed to load part ${i}`, e);
                        return [];
                    }));
                }
                const results = await Promise.all(promises);
                allVerses = results.flat();
                
                // Filter out already read verses from available pool
                const readIds = new Set(readVerses.map(v => v.verse));
                unreadVerses = allVerses.filter(v => !readIds.has(v.verse));
                console.log(`Loaded ${allVerses.length} verses. Unread: ${unreadVerses.length}`);
            } catch (err) {
                console.error("Error loading verses:", err);
                alert("Could not load verses data.");
            }
        }

        function renderMoodButtons() {
            moodGrid.innerHTML = '';
            Object.entries(MOODS).forEach(([mood, data]) => {
                const btn = document.createElement('button');
                btn.className = 'mood-btn';
                btn.dataset.mood = mood;
                btn.style.setProperty('--btn-color', data.color);
                btn.innerHTML = `<span>${mood}</span>`;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMood = mood;
                    pullBtn.style.display = 'block';
                    // Hide strip if showing
                    if(paperStrip.classList.contains('show')) {
                        paperStrip.classList.remove('show');
                        setTimeout(() => stripContainer.style.display = 'none', 500);
                    }
                });
                
                moodGrid.appendChild(btn);
            });
        }

        function pullStrip() {
            if (!selectedMood) return;

            // Stop any ongoing speech
            window.speechSynthesis.cancel();
            isSpeaking = false;

            // Increment Analytics
            moodAnalytics[selectedMood]++;
            saveAnalytics();
            renderAnalytics();

            // Find a quote for the mood
            let pool = unreadVerses.filter(v => v.mood === selectedMood);
            
            if (pool.length === 0) {
                // If all quotes for this mood are read, use allVerses as fallback pool
                pool = allVerses.filter(v => v.mood === selectedMood);
                if (pool.length === 0) {
                    alert("No quotes found for this mood!");
                    return;
                }
            }

            const randomIndex = Math.floor(Math.random() * pool.length);
            currentQuote = pool[randomIndex];

            displayQuote();
        }

        function displayQuote() {
            stripContainer.style.display = 'block';
            
            // Set styles based on mood
            paperStrip.style.setProperty('--strip-color', MOODS[currentQuote.mood].color);
            
            verseNumberEl.textContent = `Ch ${currentQuote.verse}`;
            verseExampleEl.textContent = currentQuote.example;
            
            // Default to English on new pull
            updateLanguageDisplay();

            // Check if already in revisit
            const isRead = readVerses.some(v => v.verse === currentQuote.verse);
            markReadBtn.style.display = isRead ? 'none' : 'flex';

            // Animation
            setTimeout(() => {
                paperStrip.classList.add('show');
                // Haptic feedback if supported
                if (navigator.vibrate) navigator.vibrate(50);
            }, 50);
        }

        function updateLanguageDisplay() {
            langBtns.forEach(btn => {
                if (btn.dataset.lang === currentLang) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            
            // Update text based on language and apply font changes for Sanskrit/Hindi
            verseContentEl.textContent = currentQuote[currentLang];
            
            if (currentLang === 'sanskrit' || currentLang === 'hindi') {
                verseContentEl.style.fontFamily = "'Martel', serif";
            } else {
                verseContentEl.style.fontFamily = "'Inter', sans-serif";
            }
        }

        // Language Buttons
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                updateLanguageDisplay();
            });
        });

        // Speech Synthesis
        speakBtn.addEventListener('click', () => {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                speakBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak`;
                return;
            }

            const text = currentQuote[currentLang];
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (currentLang === 'english') {
                utterance.lang = 'en-IN';
            } else {
                utterance.lang = 'hi-IN'; // Fallback for Sanskrit
            }
            
            utterance.rate = 0.8; // Slower for clarity
            
            utterance.onend = () => {
                isSpeaking = false;
                speakBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak`;
            };

            window.speechSynthesis.speak(utterance);
            isSpeaking = true;
            speakBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Stop`;
        });

        // Mark as Read
        markReadBtn.addEventListener('click', () => {
            if (!currentQuote) return;
            
            readVerses.unshift(currentQuote); // Add to top
            localStorage.setItem('gita_read_verses', JSON.stringify(readVerses));
            
            // Remove from unread
            unreadVerses = unreadVerses.filter(v => v.verse !== currentQuote.verse);
            
            markReadBtn.style.display = 'none';
            renderRevisitList();
        });

        function renderRevisitList() {
            revisitCount.textContent = `(${readVerses.length})`;
            
            if (readVerses.length === 0) {
                revisitList.innerHTML = '<div class="empty-state">No quotes saved yet.</div>';
                return;
            }
            
            revisitList.innerHTML = '';
            readVerses.forEach(quote => {
                const li = document.createElement('li');
                li.className = 'revisit-item';
                li.innerHTML = `
                    <div class="verse-ref">Chapter ${quote.verse} <span style="color:${MOODS[quote.mood].color}">• ${quote.mood}</span></div>
                    <div style="font-size: 0.95rem">${quote.english.substring(0, 60)}...</div>
                `;
                li.addEventListener('click', () => {
                    currentQuote = quote;
                    // Switch to paper strip view
                    window.scrollTo({top: 0, behavior: 'smooth'});
                    displayQuote();
                });
                revisitList.appendChild(li);
            });
        }

        function renderAnalytics() {
            analyticsList.innerHTML = '';
            
            // Sort by count descending
            const sorted = Object.entries(moodAnalytics).sort((a,b) => b[1] - a[1]);
            
            sorted.forEach(([mood, count]) => {
                if(count === 0) return; // Only show moods with >0 pulls
                
                const li = document.createElement('li');
                li.className = 'stat-item';
                li.innerHTML = `
                    <div class="stat-mood">
                        <div class="stat-color" style="background-color: ${MOODS[mood].color}"></div>
                        ${mood}
                    </div>
                    <div class="stat-count">${count}</div>
                `;
                analyticsList.appendChild(li);
            });

            if (Object.values(moodAnalytics).every(v => v === 0)) {
                analyticsList.innerHTML = '<div class="empty-state">No moods selected yet.</div>';
            }
        }

        function saveAnalytics() {
            localStorage.setItem('gita_mood_analytics', JSON.stringify(moodAnalytics));
        }

        pullBtn.addEventListener('click', pullStrip);

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>

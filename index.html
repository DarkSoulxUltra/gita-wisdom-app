<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1115">
    <title>Gita Mood-Based Wisdom</title>
    <link rel="manifest" href="manifest.json">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Martel:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-bg-hover: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            
            /* Mood Colors - More Vibrant */
            --mood-happy: #10b981;
            --mood-anger: #ef4444;
            --mood-sad: #3b82f6;
            --mood-peace: #8b5cf6;
            --mood-lazy: #f59e0b;
            --mood-lonely: #ec4899;
            --mood-protection: #f97316;
            --mood-anxiety: #14b8a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at top center, rgba(30, 41, 59, 0.5) 0%, transparent 60%),
                radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }

        header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .daily-banner {
            background: linear-gradient(90deg, #1e293b, #334155);
            color: #f8fafc;
            text-align: center;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        
        .daily-banner:hover {
            background: linear-gradient(90deg, #334155, #475569);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 1rem 0 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #94a3b8;
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-results {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
        }
        
        .search-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .search-item:hover {
            background: var(--card-bg-hover);
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Mood Selection */
        .mood-container {
            width: 100%;
            margin-bottom: 2rem;
        }
        
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .mood-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-transform: capitalize;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .mood-btn:hover {
            transform: translateY(-2px);
            background: var(--card-bg-hover);
            border-color: rgba(255,255,255,0.2);
        }

        .mood-btn.active {
            border-color: var(--btn-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px -8px var(--btn-color);
        }

        .mood-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--btn-color);
            box-shadow: 0 0 10px var(--btn-color);
        }

        /* Pull Strip Action */
        .action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .pull-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            color: #1a1a1a;
            padding: 1rem 3rem;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(253, 160, 133, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
            margin-bottom: 2rem;
        }

        .pull-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px -5px rgba(253, 160, 133, 0.6);
        }

        .pull-btn:active {
            transform: translateY(1px);
        }

        /* Paper Strip */
        .strip-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            overflow: hidden;
            display: none;
            margin-top: 1rem;
            border-radius: 8px;
            perspective: 1000px;
        }

        .paper-strip {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            color: #0f172a;
            padding: 3rem 2.5rem 2.5rem;
            position: relative;
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            border-radius: 16px;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-bottom: 6px solid var(--strip-color, #fffaf0);
        }

        .paper-strip.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .verse-number {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--strip-color, #64748b);
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.04);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        /* Context Block */
        .context-block {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0,0,0,0.03);
            border-radius: 8px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .context-block.show {
            display: block;
            opacity: 1;
        }

        .verse-content {
            font-family: 'Martel', serif;
            font-size: 1.5rem;
            line-height: 1.6;
            text-align: center;
            margin: 2rem 0;
            color: #0f172a;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verse-example {
            background: rgba(0,0,0,0.03);
            padding: 1.5rem;
            border-left: 4px solid var(--strip-color);
            margin-bottom: 2rem;
            border-radius: 0 8px 8px 0;
        }

        .verse-example .situation {
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .verse-example .insight {
            font-style: italic;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .strip-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px dashed #cbd5e1;
            padding-top: 1.5rem;
        }

        .lang-toggles, .control-btns {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .strip-btn {
            background: transparent;
            border: 1px solid #94a3b8;
            color: #475569;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .strip-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .strip-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #1e293b;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        /* Revisit & Analytics Section */
        .bottom-section {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .bottom-section {
                grid-template-columns: 2fr 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .panel h3 {
            margin-bottom: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #64748b;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem;
            position: relative;
        }

        .tab-btn.active {
            color: #f1f5f9;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -0.6rem;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--mood-happy);
        }

        .revisit-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .revisit-list::-webkit-scrollbar { width: 6px; }
        .revisit-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .revisit-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .revisit-item:hover { background: rgba(255,255,255,0.05); }

        .revisit-item .verse-ref {
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }

        .analytics-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 0.8rem 1rem;
            border-radius: 8px;
        }

        .stat-mood { display: flex; align-items: center; gap: 0.5rem; text-transform: capitalize; }
        .stat-color { width: 10px; height: 10px; border-radius: 50%; }
        .stat-count { font-weight: bold; background: var(--card-bg); padding: 0.2rem 0.6rem; border-radius: 12px; }
        
        .smart-suggestion {
            background: rgba(34, 197, 94, 0.1);
            border-left: 4px solid var(--mood-happy);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: auto;
        }

        .empty-state { color: #64748b; font-style: italic; text-align: center; padding: 2rem 0; }

        .sync-container {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            width: 100%;
        }
        
        .sync-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .sync-btn:hover { background: #1e293b; color: #fff; }

    </style>
</head>
<body>

    <div class="daily-banner" id="daily-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        Open your Daily Gita Verse
    </div>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <header>
        <h1>Divine Wisdom</h1>
        <p>Seek guidance from the Shrimad Bhagavad Gita based on your current emotional state.</p>
    </header>

    <main>
        <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Search verses (e.g. anger, peace, 2.62)...">
            <div class="search-results" id="search-results"></div>
        </div>

        <div style="display: flex; justify-content: center; width: 100%; margin-bottom: 1.5rem;">
             <button id="start-reading-btn" style="background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); border: none; color: white; padding: 0.8rem 2rem; border-radius: 30px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); font-size: 1rem; transition: transform 0.2s;">
                 Read Sequentially from Beginning
             </button>
        </div>

        <section class="mood-container">
            <div class="mood-grid" id="mood-grid"></div>
        </section>

        <section class="action-container">
            <button class="pull-btn" id="pull-btn">Pull Strip</button>

            <div class="strip-container" id="strip-container">
                <div class="paper-strip" id="paper-strip">
                    <div class="verse-number" id="verse-number">1.1</div>
                    
                    <div class="context-block" id="prev-context"></div>
                    
                    <div class="verse-content" id="verse-content"></div>
                    
                    <div class="context-block" id="next-context"></div>
                    
                    <div class="verse-example" id="verse-example">
                        <div class="situation" id="example-situation"></div>
                        <div class="insight" id="example-insight"></div>
                    </div>

                    <div class="strip-actions">
                        <div class="seq-nav-btns" style="display: flex; gap: 0.5rem; width: 100%; justify-content: space-between; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px dashed rgba(148, 163, 184, 0.3);">
                            <button class="strip-btn btn-icon" id="prev-btn">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg> Prev
                            </button>
                            <button class="strip-btn btn-icon" id="next-btn">
                                Next <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                        <div class="lang-toggles">
                            <button class="strip-btn" data-lang="sanskrit">Sanskrit</button>
                            <button class="strip-btn" data-lang="hindi">Hindi</button>
                            <button class="strip-btn active" data-lang="english">English</button>
                        </div>
                        <div class="control-btns">
                            <button class="strip-btn btn-icon" id="context-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"></path></svg> Context
                            </button>
                            <button class="strip-btn btn-icon" id="speak-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak
                            </button>
                            <button class="strip-btn btn-icon" id="fav-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            </button>
                            <button class="strip-btn btn-icon" id="mark-read-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Read
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bottom-section">
            <div class="panel">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-revisit">Revisit (<span id="revisit-count">0</span>)</button>
                    <button class="tab-btn" id="tab-fav">Favorites (<span id="fav-count">0</span>)</button>
                </div>
                <ul class="revisit-list" id="revisit-list">
                    <div class="empty-state">No quotes saved yet.</div>
                </ul>
            </div>
            <div class="panel">
                <h3>Mood Analytics</h3>
                <ul class="analytics-list" id="analytics-list"></ul>
                <div class="smart-suggestion" id="smart-suggestion" style="display:none;"></div>
                <div class="sync-container">
                    <button class="sync-btn" id="export-btn">Export</button>
                    <button class="sync-btn" id="import-btn">Import</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const MOODS = {
            happy: { color: '#22c55e' }, anger: { color: '#ef4444' }, sad: { color: '#06b6d4' },
            peace: { color: '#d946ef' }, lazy: { color: '#eab308' }, lonely: { color: '#a855f7' },
            protection: { color: '#f97316' }, anxiety: { color: '#ffbba6' }
        };

        // State
        let allVerses = [];
        let unreadVerses = [];
        let readVerses = JSON.parse(localStorage.getItem('gita_read_verses')) || [];
        let favorites = JSON.parse(localStorage.getItem('gita_favorites')) || [];
        let moodAnalytics = JSON.parse(localStorage.getItem('gita_mood_analytics')) || {};
        let dailyDate = localStorage.getItem('gita_daily_date');
        let dailyVerseId = localStorage.getItem('gita_daily_verse');
        let selectedMood = null;
        let currentQuote = null;
        let currentLang = 'english';
        let isSpeaking = false;
        let showingContext = false;
        let currentTab = 'revisit'; // 'revisit' or 'fav'

        // Init Analytics
        Object.keys(MOODS).forEach(m => { if (moodAnalytics[m] === undefined) moodAnalytics[m] = 0; });

        // DOM
        const loader = document.getElementById('loader');
        const paperStrip = document.getElementById('paper-strip');
        const stripContainer = document.getElementById('strip-container');
        const pullBtn = document.getElementById('pull-btn');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const dailyBanner = document.getElementById('daily-banner');
        
        async function init() {
            renderMoodButtons();
            await fetchAllVerses();
            renderAnalytics();
            renderList();
            checkDaily();
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        async function fetchAllVerses() {
            try {
                const promises = [];
                for (let i = 1; i <= 7; i++) {
                    promises.push(fetch(`gita_part${i}.json`).then(r => r.json()).catch(e => []));
                }
                const results = await Promise.all(promises);
                allVerses = results.flat();
                
                // Migrate old string examples if any exist in local storage to prevent errors
                readVerses.forEach(v => {
                    if(typeof v.example === 'string') {
                        v.example = { situation: "Legacy entry", insight: v.example };
                    }
                });
                favorites.forEach(v => {
                    if(typeof v.example === 'string') {
                        v.example = { situation: "Legacy entry", insight: v.example };
                    }
                });

                const readIds = new Set(readVerses.map(v => v.verse));
                unreadVerses = allVerses.filter(v => !readIds.has(v.verse));
            } catch (err) { console.error(err); }
        }

        // Daily Logic
        function checkDaily() {
            const today = new Date().toDateString();
            if (dailyDate !== today || !dailyVerseId) {
                // New day, assign new verse
                const randomV = allVerses[Math.floor(Math.random() * allVerses.length)];
                dailyVerseId = randomV.verse;
                dailyDate = today;
                localStorage.setItem('gita_daily_date', dailyDate);
                localStorage.setItem('gita_daily_verse', dailyVerseId);
            }
        }

        dailyBanner.addEventListener('click', () => {
            const verse = allVerses.find(v => v.verse === dailyVerseId);
            if(verse) {
                currentQuote = verse;
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                selectedMood = null;
                pullBtn.style.display = 'none';
                displayQuote();
            }
        });

        document.getElementById('start-reading-btn').addEventListener('click', () => {
            if(allVerses.length > 0) {
                currentQuote = allVerses[0];
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                selectedMood = null;
                pullBtn.style.display = 'none';
                displayQuote();
            }
        });

        // Search Logic
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term.length < 2) {
                searchResults.style.display = 'none';
                return;
            }
            
            const results = allVerses.filter(v => 
                v.verse.includes(term) || 
                v.english.toLowerCase().includes(term) ||
                v.mood.includes(term)
            ).slice(0, 5); // top 5
            
            if (results.length > 0) {
                searchResults.innerHTML = '';
                results.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<strong>${r.verse}</strong> - ${r.english.substring(0, 40)}...`;
                    div.onclick = () => {
                        currentQuote = r;
                        searchResults.style.display = 'none';
                        searchInput.value = '';
                        displayQuote();
                    };
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.innerHTML = '<div class="search-item">No results found</div>';
                searchResults.style.display = 'block';
            }
        });
        
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.search-container')) searchResults.style.display = 'none';
        });

        // Audio Synth
        function playPullSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        // Pulling Logic
        function renderMoodButtons() {
            const grid = document.getElementById('mood-grid');
            grid.innerHTML = '';
            Object.entries(MOODS).forEach(([mood, data]) => {
                const btn = document.createElement('button');
                btn.className = 'mood-btn';
                btn.style.setProperty('--btn-color', data.color);
                btn.innerHTML = `<span>${mood}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMood = mood;
                    pullBtn.style.display = 'block';
                    if(paperStrip.classList.contains('show')) {
                        paperStrip.classList.remove('show');
                        setTimeout(() => stripContainer.style.display = 'none', 500);
                    }
                };
                grid.appendChild(btn);
            });
        }

        pullBtn.addEventListener('click', () => {
            if (!selectedMood) return;
            window.speechSynthesis.cancel();
            isSpeaking = false;
            
            playPullSound();

            moodAnalytics[selectedMood]++;
            localStorage.setItem('gita_mood_analytics', JSON.stringify(moodAnalytics));
            renderAnalytics();

            let pool = unreadVerses.filter(v => v.mood === selectedMood);
            if (pool.length === 0) pool = allVerses.filter(v => v.mood === selectedMood);
            if (pool.length === 0) return alert("No quotes found.");

            currentQuote = pool[Math.floor(Math.random() * pool.length)];
            displayQuote();
        });

        function displayQuote() {
            stripContainer.style.display = 'block';
            showingContext = false;
            document.getElementById('prev-context').classList.remove('show');
            document.getElementById('next-context').classList.remove('show');
            
            paperStrip.style.setProperty('--strip-color', MOODS[currentQuote.mood].color);
            const verseParts = currentQuote.verse.split('.');
            document.getElementById('verse-number').textContent = `Chapter ${verseParts[0]}, Verse ${verseParts[1]}`;
            
            // Disable nav buttons if at bounds
            const idx = allVerses.findIndex(v => v.verse === currentQuote.verse);
            document.getElementById('prev-btn').style.opacity = idx <= 0 ? '0.3' : '1';
            document.getElementById('prev-btn').style.pointerEvents = idx <= 0 ? 'none' : 'auto';
            document.getElementById('next-btn').style.opacity = idx >= allVerses.length - 1 ? '0.3' : '1';
            document.getElementById('next-btn').style.pointerEvents = idx >= allVerses.length - 1 ? 'none' : 'auto';
            
            const ex = currentQuote.example;
            if(ex && ex.situation) {
                document.getElementById('example-situation').textContent = "📌 Situation: " + ex.situation;
                document.getElementById('example-insight').textContent = "💡 Insight: " + ex.insight;
            } else {
                document.getElementById('example-situation').textContent = "";
                document.getElementById('example-insight').textContent = ex; // fallback
            }

            updateLanguageDisplay();
            updateFavReadBtns();

            setTimeout(() => paperStrip.classList.add('show'), 50);
        }

        function updateLanguageDisplay() {
            document.querySelectorAll('.lang-toggles .strip-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
            const vContent = document.getElementById('verse-content');
            vContent.textContent = currentQuote[currentLang];
            vContent.style.fontFamily = (currentLang === 'english') ? "'Inter', sans-serif" : "'Martel', serif";
        }

        document.querySelectorAll('.lang-toggles .strip-btn').forEach(btn => {
            btn.onclick = () => { currentLang = btn.dataset.lang; updateLanguageDisplay(); };
        });

        function updateFavReadBtns() {
            const isRead = readVerses.some(v => v.verse === currentQuote.verse);
            document.getElementById('mark-read-btn').style.display = isRead ? 'none' : 'flex';
            
            const isFav = favorites.some(v => v.verse === currentQuote.verse);
            const favBtn = document.getElementById('fav-btn');
            if(isFav) {
                favBtn.classList.add('active');
                favBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
            } else {
                favBtn.classList.remove('active');
                favBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
            }
        }

        // Feature Actions
        document.getElementById('prev-btn').onclick = () => {
            if(!currentQuote) return;
            const idx = allVerses.findIndex(v => v.verse === currentQuote.verse);
            if(idx > 0) {
                currentQuote = allVerses[idx - 1];
                window.speechSynthesis.cancel();
                isSpeaking = false;
                displayQuote();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if(!currentQuote) return;
            const idx = allVerses.findIndex(v => v.verse === currentQuote.verse);
            if(idx !== -1 && idx < allVerses.length - 1) {
                currentQuote = allVerses[idx + 1];
                window.speechSynthesis.cancel();
                isSpeaking = false;
                displayQuote();
            }
        };

        document.getElementById('mark-read-btn').onclick = () => {
            if (!currentQuote) return;
            readVerses.unshift(currentQuote);
            localStorage.setItem('gita_read_verses', JSON.stringify(readVerses));
            unreadVerses = unreadVerses.filter(v => v.verse !== currentQuote.verse);
            updateFavReadBtns();
            if(currentTab === 'revisit') renderList();
        };

        document.getElementById('fav-btn').onclick = () => {
            if (!currentQuote) return;
            const isFav = favorites.some(v => v.verse === currentQuote.verse);
            if(isFav) {
                favorites = favorites.filter(v => v.verse !== currentQuote.verse);
            } else {
                favorites.unshift(currentQuote);
            }
            localStorage.setItem('gita_favorites', JSON.stringify(favorites));
            updateFavReadBtns();
            if(currentTab === 'fav') renderList();
        };

        // Context Mode
        document.getElementById('context-btn').onclick = () => {
            if(!currentQuote) return;
            showingContext = !showingContext;
            const pCtx = document.getElementById('prev-context');
            const nCtx = document.getElementById('next-context');
            
            if(showingContext) {
                const idx = allVerses.findIndex(v => v.verse === currentQuote.verse);
                if(idx > 0) pCtx.textContent = `[${allVerses[idx-1].verse}] ${allVerses[idx-1][currentLang].substring(0,60)}...`;
                else pCtx.textContent = "Start of text";
                
                if(idx < allVerses.length - 1) nCtx.textContent = `[${allVerses[idx+1].verse}] ${allVerses[idx+1][currentLang].substring(0,60)}...`;
                else nCtx.textContent = "End of text";
                
                pCtx.classList.add('show');
                nCtx.classList.add('show');
            } else {
                pCtx.classList.remove('show');
                nCtx.classList.remove('show');
            }
        };

        // Speech sequence
        document.getElementById('speak-btn').onclick = () => {
            const btn = document.getElementById('speak-btn');
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak`;
                return;
            }

            const verseText = currentQuote[currentLang];
            const ex = currentQuote.example;
            const insightText = ex.insight || ex;
            
            const u1 = new SpeechSynthesisUtterance(verseText);
            const u2 = new SpeechSynthesisUtterance("Takeaway. " + insightText);
            
            const langCode = (currentLang === 'english') ? 'en-IN' : 'hi-IN';
            u1.lang = langCode; u2.lang = 'en-IN';
            u1.rate = 0.8; u2.rate = 0.9;
            
            u1.onend = () => {
                if(!isSpeaking) return;
                setTimeout(() => window.speechSynthesis.speak(u2), 1000); // 1s pause
            };
            
            u2.onend = () => {
                isSpeaking = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Speak`;
            };

            window.speechSynthesis.speak(u1);
            isSpeaking = true;
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Stop`;
        };

        // Tabs
        document.getElementById('tab-revisit').onclick = () => { currentTab = 'revisit'; document.getElementById('tab-revisit').classList.add('active'); document.getElementById('tab-fav').classList.remove('active'); renderList(); };
        document.getElementById('tab-fav').onclick = () => { currentTab = 'fav'; document.getElementById('tab-fav').classList.add('active'); document.getElementById('tab-revisit').classList.remove('active'); renderList(); };

        function renderList() {
            const listEl = document.getElementById('revisit-list');
            document.getElementById('revisit-count').textContent = readVerses.length;
            document.getElementById('fav-count').textContent = favorites.length;
            
            const data = currentTab === 'revisit' ? readVerses : favorites;
            
            if (data.length === 0) {
                listEl.innerHTML = `<div class="empty-state">No quotes saved yet.</div>`;
                return;
            }
            
            listEl.innerHTML = '';
            data.forEach(quote => {
                const li = document.createElement('li');
                li.className = 'revisit-item';
                li.innerHTML = `
                    <div class="verse-ref">
                        <span>BG ${quote.verse} <span style="color:${MOODS[quote.mood].color}">• ${quote.mood}</span></span>
                        ${currentTab === 'fav' ? '⭐' : ''}
                    </div>
                    <div style="font-size: 0.95rem">${quote.english.substring(0, 60)}...</div>
                `;
                li.onclick = () => {
                    currentQuote = quote;
                    window.scrollTo({top: 0, behavior: 'smooth'});
                    displayQuote();
                };
                listEl.appendChild(li);
            });
        }

        // Smart Analytics
        function renderAnalytics() {
            const listEl = document.getElementById('analytics-list');
            listEl.innerHTML = '';
            
            const sorted = Object.entries(moodAnalytics).sort((a,b) => b[1] - a[1]);
            let total = 0;
            
            sorted.forEach(([mood, count]) => {
                total += count;
                if(count === 0) return;
                const li = document.createElement('li');
                li.className = 'stat-item';
                li.innerHTML = `
                    <div class="stat-mood"><div class="stat-color" style="background-color: ${MOODS[mood].color}"></div>${mood}</div>
                    <div class="stat-count">${count}</div>
                `;
                listEl.appendChild(li);
            });

            if (total === 0) {
                listEl.innerHTML = '<div class="empty-state">No moods selected yet.</div>';
                return;
            }

            // Smart Suggestion
            const topMood = sorted[0][0];
            const hour = new Date().getHours();
            const timeStr = (hour >= 18 || hour < 5) ? "night" : "day";
            
            let suggestion = "";
            if (topMood === 'anxiety') suggestion = "You seem anxious recently. Try exploring Peace or Protection verses.";
            else if (topMood === 'sad') suggestion = "You've been pulling Sad quotes. Remember, tough times are temporary.";
            else if (topMood === 'lazy') suggestion = "Feeling lazy? A Protection or Anger verse might spark some energy!";
            else suggestion = `You're exploring ${topMood} heavily during the ${timeStr}. Keep seeking wisdom.`;

            const suggEl = document.getElementById('smart-suggestion');
            suggEl.style.display = 'block';
            suggEl.innerHTML = `<strong>Insight:</strong> ${suggestion}`;
        }

        // Sync
        document.getElementById('export-btn').onclick = () => {
            const data = { readVerses, favorites, moodAnalytics };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const node = document.createElement('a');
            node.setAttribute("href", dataStr); node.setAttribute("download", "gita_sync.json");
            document.body.appendChild(node); node.click(); node.remove();
        };

        document.getElementById('import-btn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.readVerses) localStorage.setItem('gita_read_verses', JSON.stringify(data.readVerses));
                        if (data.favorites) localStorage.setItem('gita_favorites', JSON.stringify(data.favorites));
                        if (data.moodAnalytics) localStorage.setItem('gita_mood_analytics', JSON.stringify(data.moodAnalytics));
                        alert("Data imported! Reloading..."); location.reload();
                    } catch (err) { alert("Invalid file."); }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
